# Perfil balanced (default). Mismo modelo local small, más beam.
processing:
  profile: balanced
  device: auto
  force_cpu: false

asr:
  adapter: faster-whisper
  model_name: small
  model_folder: whisper_small_ct2_int8_fp16_local_v1
  compute_type: int8_float16
  beam_size: 3
  word_timestamps: true
  chunk_by_vad: true

diarization:
  adapter: wespeaker
  model_name: pyannote/wespeaker-voxceleb-resnet34-LM
