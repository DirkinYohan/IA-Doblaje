# Perfil performance. Modelo local real: Faster-Whisper small.
# large-v3 no está en models/. Pedirlo aquí hace fallar la carga (sin fallback silencioso).
processing:
  profile: performance
  device: auto
  force_cpu: false

asr:
  adapter: faster-whisper
  model_name: small
  model_folder: whisper_small_ct2_int8_fp16_local_v1
  compute_type: int8
  beam_size: 1
  word_timestamps: true
  chunk_by_vad: true

diarization:
  adapter: wespeaker
  model_name: pyannote/wespeaker-voxceleb-resnet34-LM
